# FairEmail Plus: merges FairEmail's updates, checks the extensions still build, and opens a pull request.
# Optionally signs the APK with your own key, in a separate job that never runs the build. See PLUS.md.
name: Plus update
run-name: Plus update${{ github.event_name == 'workflow_dispatch' && ' (manual)' || '' }}

on:
  schedule:
    - cron: '17 5 * * 1' # Mondays, 05:17 UTC
  workflow_dispatch:

concurrency:
  group: plus-update
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM: https://github.com/M66B/FairEmail.git
  UPDATE_BRANCH: plus/upstream-update

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the update branch
      pull-requests: write # opens the pull request
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge FairEmail's updates
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags "$UPSTREAM" master
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with FairEmail." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git checkout -B "$UPDATE_BRANCH"
          if ! git merge --no-edit -m "Merge FairEmail's updates" FETCH_HEAD; then
            {
              echo "### The merge needs you"
              echo "FairEmail changed something next to a \`Plus\` line. Merge it yourself, as PLUS.md describes. Conflicts:"
              echo '```'
              git diff --name-only --diff-filter=U
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"

      # A manual run builds even with nothing new, to get an APK of what's there.
      - name: Anything to build?
        id: todo
        run: echo "build=${{ steps.merge.outputs.merged == 'true' || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        if: steps.todo.outputs.build == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Test the extensions
        if: steps.todo.outputs.build == 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testGithubDebugUnitTest --tests 'eu.faircode.email.Addy*'

      # A release build has to be signed with something, so this job makes a key it throws away.
      # Your own key is only ever used by the sign job.
      - name: Build the APK
        if: steps.todo.outputs.build == 'true'
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.keystore" -storepass throwaway -keypass throwaway \
            -alias throwaway -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Throwaway"
          printf 'storeFile=%s\nstorePassword=throwaway\nkeyAlias=throwaway\nkeyPassword=throwaway\n' \
            "$RUNNER_TEMP/throwaway.keystore" > keystore.properties
          ./gradlew --no-daemon assembleGithubRelease

      - name: Keep the APK for signing
        if: steps.todo.outputs.build == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: apk-not-yet-signed
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Open the pull request
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # FairEmail's own workflow files can't be pushed with this job's token. If this fails for that reason,
          # merge on your own computer instead.
          git push --force origin "$UPDATE_BRANCH"
          if [ -z "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$UPDATE_BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base "${GITHUB_REF_NAME}" --head "$UPDATE_BRANCH" \
              --title "Merge FairEmail's updates" \
              --body "FairEmail's latest changes, merged without conflicts. The addy.io tests pass and the app builds.

          Before merging, install the APK from this run and check what the tests can't: a send to a non-alias address shows the warning, Settings → Integrations has the Extensions card, and the side menu has its addy.io section.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

  # Runs none of the project's code: it only downloads the APK and signs it with Android's own tool.
  # The key lives in the "signing" environment, so the build job above can't read it.
  sign:
    needs: build
    if: vars.SIGN_APK == 'true' && (needs.build.outputs.merged == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: signing
    permissions: {}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: apk-not-yet-signed
          path: apk

      - name: Sign with your key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          mkdir signed
          for apk in apk/*.apk; do
            out="signed/$(basename "$apk")"
            "$tools/zipalign" -f -p 4 "$apk" "$out"
            "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD "$out"
            "$tools/apksigner" verify --print-certs "$out" | grep -i "SHA-256" >> "$GITHUB_STEP_SUMMARY"
          done
          rm -f "$RUNNER_TEMP/release.keystore" signed/*.idsig

      - uses: actions/upload-artifact@v6
        with:
          name: FairEmail-Plus-signed
          path: signed/*.apk
          if-no-files-found: error
